<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ders Defteri</title>
<meta name="theme-color" content="#131315">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Ders Defteri">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Düzen: solda dersler (seçili dersin başlıklarıyla), sağda araç çubuğu ve o dersin siyah A4 sayfaları */
:root {
  --ground: #131315;
  --panel: #19191c;
  --paper: #030303;
  --line: #2b2b30;
  --rule: rgba(255,255,255,.075);
  --margin-rule: rgba(255,92,92,.28);
  --fg: #ecebe6;
  --muted: #8e8d95;
  --accent: #ffd84d;
  --danger: #ff6b6b;
  --ok: #7bdc65;
  --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "Cascadia Mono", monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
html { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); background: var(--ground); }
body { background: var(--ground); color: var(--fg); font-family: var(--body); font-size: 15px; overflow: hidden; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
button, select, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app { display: grid; grid-template-columns: 270px minmax(0, 1fr); height: 100%; }

/* ---------- Sol panel ---------- */
aside { background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; padding-left: env(safe-area-inset-left, 0px); }
.side-head { padding: 18px 18px 10px; display: flex; flex-direction: column; gap: 2px; }
.brand { font-family: var(--display); font-weight: 700; font-size: 20px; letter-spacing: -.01em; }
.label { font-family: var(--mono); font-size: 11px; color: var(--muted); letter-spacing: .07em; text-transform: uppercase; }
#lessons { flex: 1; overflow-y: auto; padding: 4px 10px 12px; display: flex; flex-direction: column; gap: 2px; }
.lesson { display: flex; flex-direction: column; border-radius: 8px; }
.lesson.active { background: rgba(255,255,255,.04); }
.lesson-row { display: flex; align-items: center; gap: 4px; }
.lesson-btn { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; padding: 9px 10px; background: none; border: 0; border-radius: 8px; text-align: left; font-weight: 700; font-size: 15px; }
.lesson-btn:hover { background: rgba(255,255,255,.05); }
.lesson-btn .dot { flex: none; width: 10px; height: 10px; border-radius: 3px; }
.lesson-btn .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lesson-btn .count { flex: none; font-family: var(--mono); font-size: 11px; font-weight: 500; color: var(--muted); }
.icon-btn { flex: none; width: 34px; height: 34px; border-radius: 8px; border: 0; background: none; color: var(--muted); font-size: 18px; line-height: 1; }
.icon-btn:hover { color: var(--fg); background: rgba(255,255,255,.06); }
.outline { display: flex; flex-direction: column; gap: 1px; padding: 0 6px 8px 14px; }
.o-item { display: flex; align-items: baseline; gap: 8px; padding: 5px 8px; background: none; border: 0; border-radius: 6px; text-align: left; line-height: 1.3; min-width: 0; font-size: 14px; color: #d6d5cf; }
.o-item:hover { background: rgba(255,255,255,.06); }
.o-item .dot { flex: none; width: 6px; height: 6px; border-radius: 50%; transform: translateY(-1px); }
.o-item .txt { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.o-item.l2 { padding-left: 22px; font-size: 13px; color: #b3b2ac; }
.o-item.l2 .dot { width: 4px; height: 4px; }
.o-hint { padding: 4px 8px; font-size: 12.5px; color: var(--muted); font-style: italic; }

.editor { display: flex; flex-direction: column; gap: 8px; padding: 8px 10px 10px; }
.editor input[type="text"], .editor input[type="password"] { width: 100%; background: var(--paper); border: 1px solid var(--line); border-radius: 8px; padding: 9px 10px; }
.mini-swatches { display: flex; flex-wrap: wrap; gap: 6px; }
.mini-swatches button { width: 24px; height: 24px; border-radius: 6px; border: 2px solid transparent; padding: 0; }
.mini-swatches button[aria-pressed="true"] { border-color: var(--fg); }
.row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.row .grow { flex: 1; }
.warn { font-size: 13px; color: var(--danger); }

.side-foot { padding: 12px; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; padding-bottom: max(12px, env(safe-area-inset-bottom, 0px)); }
.sync { display: flex; flex-direction: column; gap: 6px; }
.sync-line { display: flex; align-items: center; gap: 8px; font-family: var(--mono); font-size: 11px; color: var(--muted); padding: 0 4px; }
.sync-line .led { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
.sync-line.ok .led { background: var(--ok); }
.sync-line.wait .led { background: var(--accent); }
.sync-line.err { color: var(--danger); }
.sync-line.err .led { background: var(--danger); }
.sync-line .grow { flex: 1; min-width: 0; }

/* ---------- Butonlar ---------- */
.tb { background: transparent; border: 1px solid var(--line); border-radius: 8px; padding: 7px 11px; min-height: 38px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; white-space: nowrap; }
.tb:hover { background: rgba(255,255,255,.05); }
.tb[aria-pressed="true"] { background: var(--fg); color: var(--paper); border-color: var(--fg); }
.tb.primary { background: var(--accent); color: #111; border-color: var(--accent); font-weight: 700; }
.tb.danger { color: var(--danger); border-color: rgba(255,107,107,.45); }
.tb.b { font-weight: 700; min-width: 38px; }
.tb svg { width: 16px; height: 16px; }
.mini { background: none; border: 1px solid var(--line); border-radius: 6px; padding: 5px 9px; font-family: var(--mono); font-size: 11px; letter-spacing: .04em; color: var(--muted); }
.mini:hover { color: var(--fg); }
.mini.danger { color: var(--danger); border-color: rgba(255,107,107,.4); }

/* ---------- Ana alan ---------- */
.main { display: flex; flex-direction: column; min-width: 0; min-height: 0; position: relative; }
.bar-end { margin-left: auto; }

/* Araç çubuğu gizlenince sağ üstte küçük düğmeler kalır */
body.bar-hidden .toolbar { display: none; }
.float-ctl { position: absolute; top: 10px; right: max(16px, env(safe-area-inset-right, 0px)); z-index: 6; display: flex; gap: 6px; opacity: .55; transition: opacity .15s; }
.float-ctl:hover, .float-ctl:focus-within { opacity: 1; }
.float-ctl .tb { background: rgba(19,19,21,.85); backdrop-filter: blur(6px); min-height: 34px; padding: 5px 10px; font-size: 13px; }

/* Tam ekran düğmesi her zaman sağ üst köşede durur; aynı düğme tam ekrandan da çıkarır */
.fs-btn { position: fixed; top: calc(env(safe-area-inset-top, 0px) + 9px); right: max(10px, env(safe-area-inset-right, 0px)); z-index: 30; width: 40px; height: 40px; display: grid; place-items: center; padding: 0; border-radius: 10px; border: 1px solid var(--line); background: rgba(19,19,21,.88); backdrop-filter: blur(6px); color: var(--fg); }
.fs-btn:hover { border-color: var(--muted); }
.fs-btn svg { width: 20px; height: 20px; }
.fs-btn .fs-close, body.focus .fs-btn .fs-open { display: none; }
body.focus .fs-btn .fs-close { display: block; }
body.focus .fs-btn { opacity: .5; }
body.focus .fs-btn:hover, body.focus .fs-btn:focus-visible { opacity: 1; }
body .toolbar { padding-right: calc(max(16px, env(safe-area-inset-right, 0px)) + 46px); }
.float-ctl { right: calc(max(16px, env(safe-area-inset-right, 0px)) + 46px); }

/* Tam ekran: sol panel, araçlar ve sayfa üstündeki yazılar kaybolur, sayfa ekranı doldurur */
body.focus .app { grid-template-columns: minmax(0, 1fr); }
body.focus aside, body.focus .scrim, body.focus .toolbar, body.focus .jumpbar, body.focus .float-ctl, body.focus .page-bar { display: none !important; }
body.focus #pages { padding-top: 16px; gap: 16px; }

/* Sol üstte sayfa numarasıyla ve işaretlerle hızlı geçiş */
.jumpbar { position: sticky; top: 10px; left: 16px; z-index: 4; width: max-content; margin: 10px 0 0 16px; display: flex; align-items: center; gap: 6px; padding: 4px 6px 4px 10px; background: rgba(19,19,21,.88); backdrop-filter: blur(6px); border: 1px solid var(--line); border-radius: 10px; }
.jumpbar input { width: 58px; min-height: 32px; text-align: center; background: var(--paper); border: 1px solid var(--line); border-radius: 6px; font-family: var(--mono); font-size: 14px; -moz-appearance: textfield; }
.jumpbar input::-webkit-inner-spin-button, .jumpbar input::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
.jumpbar select.tb { min-height: 32px; padding: 4px 8px; font-size: 13px; max-width: 46vw; }

/* Sayfa işaretleri */
.mark-ribbon { position: absolute; top: 0; left: 2.5cqw; width: 2.6cqw; height: 5.5cqw; z-index: 3; clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 75%, 0 100%); pointer-events: none; }
.page-bar .mark-name { margin-left: 8px; letter-spacing: .04em; text-transform: none; font-weight: 500; }
.mark-form { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; justify-content: flex-end; }
.mark-form input { width: 140px; background: var(--paper); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; font-family: var(--body); font-size: 13px; text-transform: none; letter-spacing: 0; }
.mark-form .mini-swatches button { width: 20px; height: 20px; }
.toolbar { flex: none; z-index: 5; background: var(--ground); border-bottom: 1px solid var(--line); display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 10px max(16px, env(safe-area-inset-right, 0px)) 10px 16px; }
.group { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
.sep { width: 1px; align-self: stretch; background: var(--line); }
.swatch { width: 30px; height: 30px; border-radius: 50%; border: 2px solid transparent; padding: 0; box-shadow: inset 0 0 0 1px rgba(255,255,255,.12); }
.swatch[aria-pressed="true"] { border-color: var(--fg); box-shadow: inset 0 0 0 2px var(--ground); }
.wdot { display: inline-block; border-radius: 50%; background: currentColor; }
select.tb { padding-right: 8px; background: var(--ground); }
#toggleSide { display: none; }
.lesson-chip { display: none; align-items: center; gap: 8px; font-weight: 700; max-width: 40vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lesson-chip .dot { width: 10px; height: 10px; border-radius: 3px; flex: none; }

#scroller { flex: 1; min-height: 0; overflow: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; }
#pages { display: flex; flex-direction: column; align-items: center; gap: 28px; width: max-content; min-width: 100%; padding: 14px 16px 90px; --page-w: 820px; }
.page-wrap { width: var(--page-w); container-type: inline-size; display: flex; flex-direction: column; gap: 8px; }
.page-bar { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-family: var(--mono); font-size: 11px; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; min-height: 30px; }
.page-wrap.current .page-bar > span { color: var(--fg); }
.page-bar .actions { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
.page { position: relative; width: 100%; aspect-ratio: 210 / 297; background-color: var(--paper); border: 1px solid var(--line); border-top: 3px solid var(--lesson, var(--line)); border-radius: 3px; box-shadow: 0 18px 40px rgba(0,0,0,.45); overflow: hidden; --lh: calc(2.05cqw * 1.7); --pad-top: 6.5cqw; contain: layout paint; }
.paper-lined { background-image: linear-gradient(to right, transparent calc(5cqw - 1px), var(--margin-rule) calc(5cqw - 1px) 5cqw, transparent 5cqw), repeating-linear-gradient(to bottom, transparent 0 calc(var(--lh) - 1px), var(--rule) calc(var(--lh) - 1px) var(--lh)); background-position: 0 0, 0 var(--pad-top); background-repeat: no-repeat, repeat; background-size: 100% 100%, 100% var(--lh); }
.paper-grid { background-image: linear-gradient(to right, var(--rule) 1px, transparent 1px), linear-gradient(to bottom, var(--rule) 1px, transparent 1px); background-size: var(--lh) var(--lh); background-position: 0 var(--pad-top); }
.paper-dots { background-image: radial-gradient(circle, rgba(255,255,255,.16) .12cqw, transparent .16cqw); background-size: var(--lh) var(--lh); background-position: 0 calc(var(--pad-top) - var(--lh) / 2); }
.page-tag { position: absolute; top: 2cqw; right: 3cqw; font-family: var(--mono); font-size: 1.25cqw; letter-spacing: .08em; text-transform: uppercase; color: var(--lesson, var(--muted)); opacity: .8; pointer-events: none; z-index: 1; }

.content { position: absolute; inset: 0; padding: var(--pad-top) 7cqw 6cqw; overflow-y: auto; scrollbar-width: thin; outline: none; font-size: 2.05cqw; line-height: 1.7; color: var(--fg); caret-color: var(--accent); overflow-wrap: anywhere; }
.content > :first-child { margin-top: 0; }
.content p, .content div { margin: 0; }
.content h1 { font-family: var(--display); font-weight: 700; font-size: 1.8em; line-height: 1.2; letter-spacing: -.01em; margin: 1.1em 0 .25em; padding-top: .55em; border-top: 1px solid var(--line); text-wrap: balance; }
.content > h1:first-child { padding-top: 0; border-top: 0; }
.content h2 { font-family: var(--display); font-weight: 600; font-size: 1.28em; line-height: 1.3; margin: .75em 0 .15em; text-wrap: balance; }
.content ul, .content ol { margin: 0 0 .2em; padding-left: 1.4em; }
.content b, .content strong { font-weight: 700; }
.ink { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; pointer-events: none; z-index: 2; }
body.mode-pen .ink, body.mode-eraser .ink { pointer-events: auto; cursor: crosshair; }
body.mode-eraser .ink { cursor: cell; }

.empty { max-width: 420px; margin: 12vh auto 0; padding: 0 16px; display: flex; flex-direction: column; gap: 12px; align-items: flex-start; }
.empty h2 { margin: 0; font-family: var(--display); font-size: 26px; }
.empty p { margin: 0; color: var(--muted); line-height: 1.5; }
#loading { padding: 40px 16px; text-align: center; font-family: var(--mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.scrim { display: none; }

@media (max-width: 760px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  aside { position: fixed; inset: 0 auto 0 0; width: min(300px, 86vw); z-index: 20; transform: translateX(-102%); transition: transform .2s ease; padding-top: env(safe-area-inset-top, 0px); }
  aside.open { transform: none; box-shadow: 20px 0 50px rgba(0,0,0,.5); }
  .scrim.show { display: block; position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 15; }
  #toggleSide, .lesson-chip { display: inline-flex; }
  .sep { display: none; }
  .toolbar { gap: 6px 8px; padding-top: 8px; padding-bottom: 8px; }
  .swatch { width: 26px; height: 26px; }
  #pages { gap: 20px; padding-top: 16px; }
}
@media (prefers-reduced-motion: reduce) { aside { transition: none; } }
</style>
</head>
<body>

<button class="fs-btn" id="fullToggle" type="button" title="Tam ekran" aria-label="Tam ekran">
  <svg class="fs-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
  <svg class="fs-close" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg>
</button>

<div class="app">
  <aside id="side">
    <div class="side-head">
      <div class="brand">Ders Defteri</div>
      <div class="label">Dersler</div>
    </div>
    <nav id="lessons" aria-label="Dersler"></nav>
    <div class="side-foot">
      <div id="newLessonBox"></div>
      <div class="sync" id="syncBox"></div>
    </div>
  </aside>
  <div class="scrim" id="scrim"></div>

  <div class="main">
    <header class="toolbar" id="toolbar">
      <button class="tb" id="toggleSide" type="button">☰ Dersler</button>
      <span class="lesson-chip" id="lessonChip"></span>

      <div class="group" role="group" aria-label="Araç">
        <button class="tb" data-mode="text" type="button" aria-pressed="true">Yaz</button>
        <button class="tb" data-mode="pen" type="button" aria-pressed="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l4-1 11-11-3-3L5 16l-1 4z"/><path d="M14 6l3 3"/></svg>Kalem</button>
        <button class="tb" data-mode="eraser" type="button" aria-pressed="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 20h12"/><path d="M4 15l9-9 6 6-8 8H8z"/></svg>Silgi</button>
      </div>
      <span class="sep"></span>

      <div class="group" id="swatches" role="group" aria-label="Renk"></div>
      <span class="sep"></span>

      <div class="group" id="textTools" role="group" aria-label="Yazı biçimi">
        <button class="tb" data-block="h1" type="button" title="Satırı konu başlığı yap">Konu</button>
        <button class="tb" data-block="h2" type="button" title="Satırı alt başlık yap">Alt başlık</button>
        <button class="tb" data-block="p" type="button">Metin</button>
        <button class="tb b" data-cmd="bold" type="button" title="Kalın">K</button>
        <button class="tb" data-cmd="insertUnorderedList" type="button">• Liste</button>
      </div>

      <div class="group" id="penTools" role="group" aria-label="Kalem kalınlığı" hidden>
        <button class="tb" data-width="2" type="button" aria-label="İnce"><span class="wdot" style="width:4px;height:4px"></span></button>
        <button class="tb" data-width="4" type="button" aria-label="Orta"><span class="wdot" style="width:7px;height:7px"></span></button>
        <button class="tb" data-width="8" type="button" aria-label="Kalın"><span class="wdot" style="width:11px;height:11px"></span></button>
        <button class="tb" data-width="22" type="button">Fosforlu</button>
        <button class="tb" id="undoInk" type="button">Geri al</button>
      </div>
      <span class="sep"></span>

      <div class="group">
        <select class="tb" id="paperStyle" aria-label="Seçili sayfanın kâğıdı">
          <option value="lined">Çizgili</option>
          <option value="grid">Kareli</option>
          <option value="dots">Noktalı</option>
          <option value="plain">Düz</option>
        </select>
        <select class="tb" id="zoom" aria-label="Yakınlaştırma">
          <option value="1">Sığdır</option>
          <option value="1.5">%150</option>
          <option value="2">%200</option>
          <option value="3">%300</option>
        </select>
        <button class="tb primary" id="addPageBtn" type="button">+ A4 sayfa</button>
      </div>
      <div class="group bar-end">
        <button class="tb" id="hideBar" type="button" title="Araçları gizle" aria-label="Araçları gizle">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 15l6-6 6 6"/></svg></button>
      </div>
    </header>

    <div class="float-ctl" id="floatCtl" hidden>
      <button class="tb" id="showBar" type="button" title="Araçları göster">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>Araçlar</button>
    </div>

    <div id="scroller">
      <div class="jumpbar" id="jumpbar" hidden>
        <label for="pageJump" class="label">Sayfa</label>
        <input id="pageJump" type="number" min="1" value="1" inputmode="numeric" enterkeyhint="go">
        <span id="pageTotal" class="label">/ 1</span>
        <select class="tb" id="markJump" aria-label="İşaretli sayfaya git"></select>
      </div>
      <div id="loading">Defter açılıyor…</div>
      <div id="pages"></div>
      <div class="empty" id="empty" hidden>
        <h2>Henüz ders yok</h2>
        <p>Soldaki “+ Yeni ders” ile ilk dersini aç. Her dersin kendi A4 sayfaları olur.</p>
        <button class="tb primary" id="emptyAdd" type="button">+ Yeni ders</button>
      </div>
    </div>
  </div>
</div>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
